[project]
name = "retention"
version = "0.1.0"
description = "Neobank retention and churn analysis: activity definition, cohorts, leakage-safe churn model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "duckdb>=1.5.6",
]

[project.optional-dependencies]
shap = ["shap>=0.44"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
